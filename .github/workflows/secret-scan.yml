name: secret-scan
# Blocks secrets AND infrastructure details (LAN IPs, SSH ports, home paths,
# internal hostnames). Rules: .gitleaks.toml. Policy: coding-conventions §5.
#
# Scans only the commits a push / PR adds, so history that predates the scan
# never turns a build red. "Run workflow" (workflow_dispatch) scans everything.
# Findings are reported as file:line + rule only — the values never reach the log.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          has_commit() { [ -n "$1" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          range=""
          case "$EVENT" in
            pull_request) has_commit "$PR_BASE" && has_commit "$PR_HEAD" && range="$PR_BASE..$PR_HEAD" ;;
            push)         has_commit "$PUSH_BEFORE" && range="$PUSH_BEFORE..$GITHUB_SHA" ;;
          esac
          echo "scope: ${range:-full history}"

          args=(git . --no-banner --redact --exit-code 1
                --report-format json --report-path "$RUNNER_TEMP/findings.json")
          [ -f .gitleaks.toml ] && args+=(--config .gitleaks.toml)
          [ -n "$range" ] && args+=("--log-opts=$range")

          rc=0
          "$RUNNER_TEMP/gitleaks" "${args[@]}" || rc=$?
          [ "$rc" -le 1 ] || { echo "::error::gitleaks failed to run (exit $rc)"; exit "$rc"; }
          [ "$rc" -eq 0 ] && { echo "clean"; exit 0; }

          jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=\(.RuleID)::\(.Description) (commit \(.Commit[0:7]))"' \
            "$RUNNER_TEMP/findings.json"
          {
            echo "## secret-scan: $(jq length "$RUNNER_TEMP/findings.json") finding(s)"
            echo
            echo "| file | line | rule | commit |"
            echo "|---|---|---|---|"
            jq -r '.[] | "| `\(.File)` | \(.StartLine) | \(.RuleID) | \(.Commit[0:7]) |"' "$RUNNER_TEMP/findings.json"
            echo
            echo "**Fix:** move the real value to \`.env\` (name it in \`.env.example\`) and reference it,"
            echo "or use a placeholder: \`192.0.2.x\`, \`example.com\`, \`\$HOME\`."
            echo "A reviewed, deliberate exception: end that line with the comment \`gitleaks:allow\`."
            echo "A value in an earlier commit of this branch stays visible in the PR even after a fix commit —"
            echo "rewrite the branch (amend / interactive rebase, then force-push) so the commit never reaches GitHub history."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
