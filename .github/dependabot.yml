version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    labels: ["deps"]
    commit-message: { prefix: "chore(deps)" }
    ignore:
      # typescript-eslint@8 declares peer typescript ">=4.8.4 <6.1.0", so a major
      # bump to TypeScript 7 breaks `npm install` with ERESOLVE and CI rejects the
      # PR every time. Drop this rule once typescript-eslint widens the range.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
    labels: ["deps"]
    commit-message: { prefix: "chore(ci)" }
